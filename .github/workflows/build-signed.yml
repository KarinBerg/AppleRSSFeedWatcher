name: Build Signed App

# Runs only on tag pushes (e.g. v1.0.0) and manual dispatch.
# NOT on pull requests — secrets are never exposed to fork PRs, and we
# don't want signing to run for untrusted code in a public repo.

# IMPORTANT: Pin used actions to a specific commit SHA to avoid supply-chain attacks. See https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create/update the GitHub Release on tag builds

jobs:
  build:
    runs-on: macos-26
    env:
      SCHEME: AppleRSSFeedWatcher
      PROJECT: src/AppleRSSFeedWatcher/AppleRSSFeedWatcher.xcodeproj
      TEAM_ID: FW7Z27RMMT

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0  # 0 = full history + all branches; N = last N commits

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.6.app

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Decode the base64 certificate from the secret.
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          # Create a temporary keychain and make it searchable.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the cert and allow codesign to use it without a prompt.
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Set version and build number
        run: |
          set -euo pipefail
          export XCCONFIG_DIR="src/AppleRSSFeedWatcher"
          ./.github/ci/SetVersionAndBuildNumber.sh
          echo "Content of $XCCONFIG_DIR/Versioning.xcconfig:"
          cat $XCCONFIG_DIR/Versioning.xcconfig

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/AppleRSSFeedWatcher.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            -allowProvisioningUpdates

      - name: Export signed .app
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AppleRSSFeedWatcher.xcarchive" \
            -exportOptionsPlist .github/ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Verify signature
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/AppleRSSFeedWatcher.app"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Collect debug symbols (dSYMs)
        run: |
          set -euo pipefail
          DSYM_DIR="$RUNNER_TEMP/AppleRSSFeedWatcher.xcarchive/dSYMs"
          if [ ! -d "$DSYM_DIR" ] || [ -z "$(ls -A "$DSYM_DIR")" ]; then
            echo "::error::No dSYMs found in the archive."
            exit 1
          fi
          # Zip every .dSYM bundle from the archive into one artifact.
          ditto -c -k --keepParent "$DSYM_DIR" "$RUNNER_TEMP/export/AppleRSSFeedWatcher-dSYMs.zip"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # Decode the .p8 private key from the secret for notarytool.
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode -o "$RUNNER_TEMP/api_key.p8"

      - name: Notarize and staple app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/AppleRSSFeedWatcher.app"

          # notarytool can't submit a .app directly — zip it first.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/api_key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          # Staple the ticket into the app so first launch works offline.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Create DMG
        run: |
          set -euo pipefail
          brew install create-dmg
          APP="$RUNNER_TEMP/export/AppleRSSFeedWatcher.app"
          mkdir -p "$RUNNER_TEMP/export/dmg"
          DMG="$RUNNER_TEMP/export/dmg/AppleRSSFeedWatcher.dmg"

          # Build a drag-to-install DMG: the app on the left, an
          # Applications symlink on the right.
          create-dmg \
            --volname "AppleRSSFeedWatcher" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "AppleRSSFeedWatcher.app" 150 190 \
            --app-drop-link 450 190 \
            --no-internet-enable \
            "$DMG" \
            "$APP"

      - name: Sign DMG
        run: |
          set -euo pipefail
          DMG="$RUNNER_TEMP/export/dmg/AppleRSSFeedWatcher.dmg"
          codesign --force --sign "Developer ID Application" --timestamp \
            "$DMG"
          codesign --verify --verbose=2 "$DMG"

      - name: Notarize and staple DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="$RUNNER_TEMP/export/dmg/AppleRSSFeedWatcher.dmg"

          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/api_key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          # Staple the ticket into the DMG so Gatekeeper passes offline.
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Download and verify Sparkle tools
        run: |
          set -euo pipefail
          SPARKLE_VERSION=2.10.0
          SPARKLE_SHA256=17e28312b8e18ab7cdbbe09a6fb28cc55a5479ec6c371dbc07cdecd2a14fd959
          
          # Keep the download out of the checked-out workspace.
          SPARKLE_ZIP="$RUNNER_TEMP/sparkle.zip"

          curl -fsSL -o "$SPARKLE_ZIP" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip"
          echo "${SPARKLE_SHA256}  ${SPARKLE_ZIP}" | shasum -a 256 -c -
          unzip -q "$SPARKLE_ZIP" -d "$RUNNER_TEMP/sparkle-tools"

      - name: Sign DMG with Sparkle Ed25519 private key
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "$SPARKLE_ED25519_PRIVATE_KEY" | $RUNNER_TEMP/sparkle-tools/bin/sign_update --ed-key-file - ${{ runner.temp }}/export/dmg/AppleRSSFeedWatcher.dmg

      - name: Create appcast.xml for Sparkle
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "$SPARKLE_ED25519_PRIVATE_KEY" | $RUNNER_TEMP/sparkle-tools/bin/generate_appcast --link https://github.com/KarinBerg/AppleRSSFeedWatcher --download-url-prefix https://github.com/KarinBerg/AppleRSSFeedWatcher/releases/latest/download/ --ed-key-file - ${{ runner.temp }}/export/dmg/

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: AppleRSSFeedWatcher-dmg
          path: ${{ runner.temp }}/export/dmg/AppleRSSFeedWatcher.dmg

      - name: Upload dSYMs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: AppleRSSFeedWatcher-dSYMs
          path: ${{ runner.temp }}/export/AppleRSSFeedWatcher-dSYMs.zip

      - name: Upload appcast.xml artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: appcast-xml
          path: ${{ runner.temp }}/export/dmg/appcast.xml

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 #v3.0.3
        with:
          files: ${{ runner.temp }}/export/dmg/AppleRSSFeedWatcher.dmg

      - name: Attach dSYMs to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 #v3.0.3
        with:
          files: ${{ runner.temp }}/export/AppleRSSFeedWatcher-dSYMs.zip
      
      - name: Attach appcast.xml to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 #v3.0.3
        with:
          files: ${{ runner.temp }}/export/dmg/appcast.xml

      - name: Clean up secrets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/api_key.p8" "$RUNNER_TEMP/cert.p12" || true
